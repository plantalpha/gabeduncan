<script>
  const floaterImages = [
      "https://static.vecteezy.com/system/resources/thumbnails/041/640/042/small/ai-generated-isolated-soap-bubble-cut-out-soap-bubble-on-transparent-background-png.png",
      "https://static.vecteezy.com/system/resources/thumbnails/041/640/042/small/ai-generated-isolated-soap-bubble-cut-out-soap-bubble-on-transparent-background-png.png",
      "https://media.tenor.com/TVdvv_3wKY8AAAAj/glorp-bouncing-slime.gif"
  ];

  const container = document.getElementById("floating-background");

  function spawnFloater() {
      const floater = document.createElement("div");
      floater.classList.add("floater");

      const img = document.createElement("img");

      const randomImage =
          floaterImages[Math.floor(Math.random() * floaterImages.length)];

      img.src = randomImage;

      const randomTop = Math.random() * 85;
      const randomSize = 40 + Math.random() * 100;
      const randomDuration = 20 + Math.random() * 30;

      floater.style.top = randomTop + "%";
      floater.style.width = randomSize + "px";
      floater.style.animationDuration = randomDuration + "s";

      floater.appendChild(img);
      container.appendChild(floater);

      setTimeout(() => {
          floater.remove();
      }, randomDuration * 1000);
  }

  setInterval(() => {
      spawnFloater();
  }, 2000);
</script>
